name: RAG verification
on:
  push:
    branches: [main, 'feat/production-rag-pipeline']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: ruff check app tests scripts
      - run: python -m compileall -q app scripts
      - run: docker compose config --quiet
  integration:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RAG_BACKEND: production
      RAG_INDEX_VERSION: ci
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e '.[dev,integrations]'
      - run: docker compose up -d --wait --wait-timeout 240 redis elasticsearch milvus
      - run: python -m scripts.ingest
      - run: python -m scripts.benchmark_retrieval --backend production --output reports/retrieval_production.json
      - run: python -m scripts.smoke_production > reports/smoke_production.json
      - if: always()
        run: docker compose logs --no-color --tail 100 > reports/services.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-rag-evidence
          path: reports/
      - if: always()
        run: docker compose down
